# Avanti — Local Development Stack
# Mirrors production: PostgreSQL 16 + Redis 7 + Mailpit (email catcher)
#
# Start:  npm run dev  (runs docker compose up -d automatically)
# Stop:   npm run dev:stop
# Reset:  npm run db:reset

version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: avanti_control
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev_user -d avanti_control']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Catches all outgoing emails locally — view at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI

volumes:
  postgres_data:
